<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Variable Name Generator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="static/style.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="card shadow main-card">
            <div class="card-body">
                <h2 class="mb-3 text-center">Generate Variable Name</h2>

                <div id="fields-container" class="row g-3"></div>

                <div id="abbreviations-container" class="row g-3 mt-3"></div>

                <!-- ✅ NEW LENGTH STATUS UI -->
                <div id="length-status" class="length-box d-none">
                    <div>
                        Total Description Length: 
                        <span id="total-length">0</span>
                    </div>
                    <div id="length-message" class="length-message"></div>
                </div>

                <div id="action-buttons" class="mt-3">
                    <button id="fetch-options" class="btn btn-primary">Fetch Abbreviations</button>
                    <button id="generate-btn" class="btn btn-success" disabled>Generate Variable Name</button>
                </div>

                <div id="warning-box"></div>
                <div class="alert mt-4 d-none" id="result" role="alert"></div>
            </div>
        </div>
    </div>

    <script src="static/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
