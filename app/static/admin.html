<!-- app/static/admin.html -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="style.css" rel="stylesheet"/>
  <style>
    body {
      background-color: #f8f9fa;
      padding-top: 30px;
    }
    .standard-btn {
      margin: 5px;
    }
    #pending-list li {
      padding: 8px;
      border: 1px solid #dee2e6;
      border-radius: 4px;
      margin-bottom: 5px;
      background-color: white;
    }
    .action-buttons {
      margin-top: 15px;
    }
    #selected-standard {
      margin: 15px 0;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card shadow-sm">
      <div class="card-body">
        <h3 class="card-title">Add Edit Update Fields</h3>

        <div id="standards-list" class="mb-3">
          <!-- Bootstrap buttons will be injected here -->
        </div>

        <div id="selected-standard"></div>

        <ul id="pending-list" class="list-unstyled"></ul>

        <div class="action-buttons d-none" id="action-buttons">
          <button class="btn btn-secondary me-2" id="select-all-btn">
            Select All
          </button>
          <button class="btn btn-success me-2" id="approve-btn">
            Approve Selected
          </button>
          <button class="btn btn-danger" id="delete-btn">
            Delete Selected
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const BACKEND_URL = "http://192.168.10.71:8000";  // 🔒 hardcoded backend URL
    const standardsContainer = document.getElementById("standards-list");
    const pendingList = document.getElementById("pending-list");
    const actionButtons = document.getElementById("action-buttons");
    const selectedStandardDiv = document.getElementById("selected-standard");

    let currentField = "";

    // Load dynamic fields from backend
    async function loadFields() {
      try {
        const res = await fetch(`${BACKEND_URL}/fields`);
        if (!res.ok) {
          console.error("Failed to fetch fields");
          return;
        }

        const data = await res.json();
        const fieldsObj = data.fields || {};

        Object.entries(fieldsObj).forEach(([field, config]) => {
          if (config.type !== "select") return;   // 🔒 only select fields

          const btn = document.createElement("button");
          btn.className = "btn btn-outline-primary standard-btn";
          btn.innerText = field.toUpperCase();
          btn.addEventListener("click", () => selectField(field));
          standardsContainer.appendChild(btn);
        });

      } catch (err) {
        console.error("Error loading fields", err);
      }
    }

    async function selectField(field) {
      currentField = field;
      selectedStandardDiv.innerText = `Editing Field: ${field.toUpperCase()}`;
      pendingList.innerHTML = "";
      actionButtons.classList.add("d-none");

      try {
        const res = await fetch(`${BACKEND_URL}/fields/${field}/raw`);
        if (!res.ok) {
          pendingList.innerHTML = `<li>Error loading data</li>`;
          return;
        }

        const data = await res.json();

        const li = document.createElement("li");

        const textarea = document.createElement("textarea");
        textarea.className = "form-control";
        textarea.rows = 20;
        textarea.id = "json-editor";
        textarea.value = JSON.stringify(data.data || {}, null, 2);

        li.appendChild(textarea);
        pendingList.appendChild(li);

        // Replace old action buttons with Save only
        actionButtons.innerHTML = `
          <button class="btn btn-success" id="save-btn">
            Save Changes
          </button>
        `;

        actionButtons.classList.remove("d-none");

        document.getElementById("save-btn")
          .addEventListener("click", saveChanges);

      } catch (err) {
        console.error("Error loading field", err);
      }
    }

    async function saveChanges() {
      const textarea = document.getElementById("json-editor");

      let parsed;
      try {
        parsed = JSON.parse(textarea.value);
      } catch (err) {
        alert("Invalid JSON format.");
        return;
      }

      const res = await fetch(`${BACKEND_URL}/fields/${currentField}/raw`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(parsed),
      });

      const responseData = await res.json();

      if (res.ok) {
        alert("Updated successfully! Total entries: " + responseData.total_entries);
      } else {
        alert("Error: " + (responseData.error || "Update failed"));
      }
    }

    document.addEventListener("DOMContentLoaded", loadFields);
  </script>
</body>
</html>
